<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>It's Important 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: 'Pacifico', cursive;
  overflow: hidden;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 24px;
  text-align: center;
  width: 92%;
  max-width: 360px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

h1 {
  color: #ff4d6d;
  font-size: 26px;
}

.name {
  font-size: 24px;
  color: #ff6f91;
  margin-bottom: 10px;
}

.stickers img {
  width: 90px;
  margin: 6px;
}

.buttons {
  position: relative;
  height: 140px;
  margin-top: 10px;
}

button {
  padding: 12px 26px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  font-family: inherit;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
}

#noBtn {
  background: #ddd;
  position: absolute;
  left: 110px;
  top: 70px;
}

.no-text {
  font-size: 14px;
  color: #ff4d6d;
  margin-top: 6px;
  min-height: 18px;
}

/* LOVE SCREEN */
.love-message {
  display: none;
  animation: fadeIn 1.5s ease;
}

.love-text {
  font-size: 18px;
  color: #ff4d6d;
  margin-bottom: 10px;
}

.animated-love {
  font-size: 28px;
  margin: 10px 0;
  animation: pulse 1.5s infinite;
}

.reactions img {
  width: 90px;
  margin: 6px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.heart {
  position: fixed;
  font-size: 22px;
  animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-600px); }
}
</style>
</head>

<body>

<div class="card">

  <!-- FIRST SCREEN -->
  <div id="firstScreen">
    <div class="stickers">
      <img src="bubu-hug.gif">
      <img src="bubu-rose.gif">
    </div>

    <h1>Will you be my Valentine?</h1>
    <div class="name">Sanjanaaaaa 💕</div>

    <div class="buttons">
      <button id="yesBtn">Yes 💘</button>
      <button id="noBtn">No 😜</button>
      <div class="no-text" id="noText"></div>
    </div>
  </div>

  <!-- LOVE SCREEN -->
  <div class="love-message" id="loveMsg">
    <div class="love-text">
      You are my smile, my safe place,<br>
      my reason to be silly and happy.<br><br>
      I don’t need a special day to choose you,<br>
      but I’m glad today exists to remind you —<br>
      <b>it’s always been you.</b> 💖
    </div>

    <div class="animated-love">
      I LOVE YOU SANJANAAAA ❤️
    </div>

    <div class="reactions">
      <img src="bubu-hug.gif">
      <img src="bubu-kiss.gif">
    </div>
  </div>

</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const noText = document.getElementById("noText");
const loveMsg = document.getElementById("loveMsg");
const firstScreen = document.getElementById("firstScreen");

const noMessages = [
  "Think again 🥺",
  "Pleaseeee 😭",
  "I am crying 💔",
  "You are breaking my heart 💔",
  "Please mamma’s princess 🥹"
];

let msgIndex = 0;

function moveNo() {
  const x = Math.random() * 220 - 110;
  const y = Math.random() * 220 - 110;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
  noText.innerText = noMessages[msgIndex % noMessages.length];
  msgIndex++;
}

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("click", moveNo);

yesBtn.addEventListener("click", () => {
  firstScreen.style.display = "none";
  loveMsg.style.display = "block";
  confettiHearts();
});

function confettiHearts() {
  for (let i = 0; i < 40; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "0px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 3000);
  }
}
</script>

</body>
</html>
